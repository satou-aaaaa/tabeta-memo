name: METs read (一時)
on:
  push:
    branches: [claude/project-thread-7ttpx3]
    paths: [.github/workflows/mets-read.yml]
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - run: |
          set -euo pipefail
          sudo apt-get install -y -qq poppler-utils >/dev/null
          curl -sS -A "satou-aaaaa-tabeta-memo/1.0 (+https://github.com/satou-aaaaa/tabeta-memo)" -o mets.pdf https://kennet.mhlw.go.jp/tools/pdf/mets.pdf
          pdftotext -layout mets.pdf - | sed 's/^/| /'
